options {
  directory "/var/cache/bind";
  listen-on port 5300 { any; };
  listen-on-v6 { none; };
  recursion no;
  dnssec-validation no;
};

# Synthetic zone for the end-to-end test; updates are accepted from anyone.
zone "example.test" {
  type primary;
  file "/var/cache/bind/example.test.zone";
  allow-update { any; };
};
